name: Linux kernel build and QEMU boot

on:
  push:
    paths:
      - "kernel/**"
      - "initramfs/**"
      - "scripts/build-kernel.sh"
      - "scripts/build-initramfs.sh"
      - "scripts/build-initramfs-target.sh"
      - "scripts/test-kernel-qemu.sh"
      - "scripts/test-kernel-qemu-multiarch.sh"
      - "scripts/build-kernel-aarch64-uefi.sh"
      - "scripts/test-kernel-qemu-aarch64-uefi.sh"
      - "scripts/verify_aarch64_efi_image.py"
      - "tests/test_aarch64_efi_image.py"
      - ".github/workflows/kernel-build.yml"
  pull_request:
    paths:
      - "kernel/**"
      - "initramfs/**"
      - "scripts/build-kernel.sh"
      - "scripts/build-initramfs.sh"
      - "scripts/build-initramfs-target.sh"
      - "scripts/test-kernel-qemu.sh"
      - "scripts/test-kernel-qemu-multiarch.sh"
      - "scripts/build-kernel-aarch64-uefi.sh"
      - "scripts/test-kernel-qemu-aarch64-uefi.sh"
      - "scripts/verify_aarch64_efi_image.py"
      - "tests/test_aarch64_efi_image.py"
      - ".github/workflows/kernel-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  x86_64-kernel-qemu:
    name: Verify, build, and boot Linux (x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out Aura OS
        uses: actions/checkout@v4

      - name: Install kernel, verification, initramfs, and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libelf-dev libssl-dev libncurses-dev \
            git gnupg curl busybox-static cpio gzip qemu-system-x86 ovmf grub-efi-amd64-bin mtools parted

      - name: Verify source and build upstream Linux kernel
        run: JOBS=2 bash scripts/build-kernel.sh

      - name: Build minimal initramfs
        run: BUSYBOX=/usr/bin/busybox bash scripts/build-initramfs.sh

      - name: Boot kernel and initramfs in QEMU
        run: bash scripts/test-kernel-qemu.sh

      - name: Upload kernel, initramfs, provenance, and boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-linux-x86_64-qemu-bringup
          path: |
            build/kernel/arch/x86/boot/bzImage
            build/kernel/.config
            build/kernel/x86_64-kernel-image.sha256
            build/kernel/source-verification.txt
            build/initramfs/aura-initramfs.cpio.gz
            build/initramfs/aura-initramfs.cpio.gz.sha256
            build/qemu/aura-qemu-boot.log
            build/qemu/firmware-provenance.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  cross-architecture-qemu:
    name: Verify, build, and boot Linux (${{ matrix.target_arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_arch: riscv64
            cross_packages: gcc-riscv64-linux-gnu qemu-system-misc
          - target_arch: aarch64
            cross_packages: gcc-aarch64-linux-gnu qemu-system-arm
    steps:
      - name: Check out Aura OS
        uses: actions/checkout@v4

      - name: Run AArch64 EFI image validator unit tests
        if: matrix.target_arch == 'aarch64'
        run: python3 -m unittest discover -s tests -p 'test_aarch64_efi_image.py' -v

      - name: Install cross toolchain and QEMU
        env:
          CROSS_PACKAGES: ${{ matrix.cross_packages }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libelf-dev libssl-dev libncurses-dev \
            git gnupg curl cpio gzip ${CROSS_PACKAGES}

      - name: Verify source and cross-build upstream Linux kernel
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
          JOBS: "2"
        run: bash scripts/build-kernel.sh

      - name: Build target-native static initramfs
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: bash scripts/build-initramfs-target.sh

      - name: Boot target kernel and initramfs in QEMU
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: bash scripts/test-kernel-qemu-multiarch.sh

      - name: Install AArch64 UEFI firmware and image tools
        if: matrix.target_arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-efi-aarch64 mtools parted

      - name: Build AArch64 EFI-stub kernel with embedded initramfs
        if: matrix.target_arch == 'aarch64'
        env:
          CROSS_COMPILE: aarch64-linux-gnu-
          JOBS: "2"
        run: bash scripts/build-kernel-aarch64-uefi.sh

      - name: Boot AArch64 kernel through AAVMF UEFI
        if: matrix.target_arch == 'aarch64'
        run: bash scripts/test-kernel-qemu-aarch64-uefi.sh

      - name: Upload kernel, initramfs, provenance, and boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-linux-${{ matrix.target_arch }}-qemu-bringup
          path: |
            build/kernel/arch/**/boot/Image
            build/kernel/.config
            build/kernel/*-kernel-image.sha256
            build/kernel/source-verification.txt
            build/initramfs/aura-initramfs-${{ matrix.target_arch }}.cpio.gz
            build/initramfs/aura-initramfs-${{ matrix.target_arch }}.cpio.gz.sha256
            build/qemu/aura-${{ matrix.target_arch }}-qemu-boot.log
            build/qemu/${{ matrix.target_arch }}-firmware-provenance.txt
            build/kernel-aarch64-uefi/arch/arm64/boot/Image
            build/kernel-aarch64-uefi/aarch64-uefi-kernel-image.sha256
            build/kernel-aarch64-uefi/source-verification.txt
            build/qemu/aura-aarch64-uefi-boot.log
            build/qemu/aarch64-uefi-firmware-provenance.txt
            build/qemu/aura-aarch64-uefi-esp.img
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
