name: Aura installable UEFI media

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "kernel/configs/**"
      - "initramfs/**"
      - "system/base/**"
      - "docs/recovery-mode.md"
      - "docs/decisions/0012-installed-system-recovery-mode.md"
      - "Plan.md"
      - "scripts/build-kernel.sh"
      - "scripts/build-initramfs-target.sh"
      - "scripts/build-installer-initramfs.sh"
      - "scripts/build-installed-kernel.sh"
      - "scripts/build-kernel-package.sh"
      - "scripts/build-kernel-apt-repository.sh"
      - "scripts/prepare-apt-repository-key.sh"
      - "scripts/build-kernel-efi-iso.sh"
      - "scripts/build-uefi-iso.sh"
      - "scripts/build-base-rootfs.sh"
      - "scripts/prepare-debian-trixie-keyring.sh"
      - "scripts/test-installer-qemu.py"
      - "scripts/ensure-ubuntu-apt-sources.sh"
      - "scripts/verify_base_rootfs.py"
      - "scripts/verify_aarch64_efi_image.py"
      - "tests/test_installer_contract.py"
      - "tests/test_installer_signing.py"
      - "tests/test_kernel_package.py"
      - "tests/test_kernel_lifecycle.py"
      - "tests/test_kernel_apt_repository.py"
      - "tests/test_ubuntu_apt_sources.py"
      - "docs/installation-media.md"
      - "docs/decisions/0010-debian-installer-layout.md"
      - "docs/decisions/0016-kernel-package-update-policy.md"
      - "docs/decisions/0017-signed-installer-media.md"
      - "docs/kernel-apt-repository.md"
      - ".github/workflows/installer-iso.yml"
  pull_request:
    paths:
      - "kernel/configs/**"
      - "initramfs/**"
      - "system/base/**"
      - "docs/recovery-mode.md"
      - "docs/decisions/0012-installed-system-recovery-mode.md"
      - "Plan.md"
      - "scripts/build-kernel.sh"
      - "scripts/build-initramfs-target.sh"
      - "scripts/build-installer-initramfs.sh"
      - "scripts/build-installed-kernel.sh"
      - "scripts/build-kernel-package.sh"
      - "scripts/build-kernel-apt-repository.sh"
      - "scripts/prepare-apt-repository-key.sh"
      - "scripts/build-kernel-efi-iso.sh"
      - "scripts/build-uefi-iso.sh"
      - "scripts/build-base-rootfs.sh"
      - "scripts/prepare-debian-trixie-keyring.sh"
      - "scripts/test-installer-qemu.py"
      - "scripts/ensure-ubuntu-apt-sources.sh"
      - "scripts/verify_base_rootfs.py"
      - "scripts/verify_aarch64_efi_image.py"
      - "tests/test_installer_contract.py"
      - "tests/test_installer_signing.py"
      - "tests/test_kernel_package.py"
      - "tests/test_kernel_lifecycle.py"
      - "tests/test_kernel_apt_repository.py"
      - "tests/test_ubuntu_apt_sources.py"
      - "docs/installation-media.md"
      - "docs/decisions/0010-debian-installer-layout.md"
      - "docs/decisions/0016-kernel-package-update-policy.md"
      - "docs/decisions/0017-signed-installer-media.md"
      - "docs/kernel-apt-repository.md"
      - ".github/workflows/installer-iso.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-boot:
    name: Install and boot Aura OS (${{ matrix.target_arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_arch: x86_64
            cross_packages: ""
            qemu_package: qemu-system-x86
            firmware_packages: ovmf
          - target_arch: aarch64
            cross_packages: gcc-aarch64-linux-gnu
            qemu_package: qemu-system-arm
            firmware_packages: qemu-efi-aarch64
          - target_arch: riscv64
            cross_packages: gcc-riscv64-linux-gnu
            qemu_package: qemu-system-misc
            firmware_packages: opensbi qemu-efi-riscv64

    steps:
      - name: Check out Aura OS
        uses: actions/checkout@v4

      - name: Check script syntax and installer contract tests
        run: |
          bash -n scripts/build-base-rootfs.sh scripts/build-initramfs-target.sh \
            scripts/build-installer-initramfs.sh scripts/build-installed-kernel.sh \
            scripts/build-kernel-efi-iso.sh scripts/build-kernel-package.sh scripts/build-kernel-apt-repository.sh scripts/build-uefi-iso.sh \
            scripts/ensure-ubuntu-apt-sources.sh scripts/prepare-apt-repository-key.sh
          sh -n system/base/installer/init system/base/installer/install.sh \
            system/base/installer/rescue.sh system/base/installer/backup.sh \
            system/base/installer/restore.sh system/base/installer/verify-media.sh \
            system/base/kernel/update-grub-menu system/base/kernel/activate-kernel \
            system/base/kernel/confirm-boot system/base/kernel/postinst \
            system/base/kernel/image-prerm system/base/kernel/image-postrm
          sh -n system/base/recovery/aura-recovery-banner
          python3 -m py_compile scripts/test-installer-qemu.py
          python3 -m unittest discover -s tests -p 'test_installer_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_installer_signing.py' -v
          python3 -m unittest discover -s tests -p 'test_kernel_package.py' -v
          python3 -m unittest discover -s tests -p 'test_kernel_lifecycle.py' -v
          python3 -m unittest discover -s tests -p 'test_base_rootfs.py' -v
          python3 -m unittest discover -s tests -p 'test_aura_firstboot.py' -v
          python3 -m unittest discover -s tests -p 'test_ubuntu_apt_sources.py' -v
          cc -std=c11 -Wall -Wextra -Werror -pedantic -I initramfs \
            tests/test_initramfs_root_uuid.c -o "$RUNNER_TEMP/test-initramfs-root-uuid"
          "$RUNNER_TEMP/test-initramfs-root-uuid"

      - name: Install cross-build, Debian bootstrap, image, and QEMU dependencies
        env:
          CROSS_PACKAGES: ${{ matrix.cross_packages }}
          QEMU_PACKAGE: ${{ matrix.qemu_package }}
          FIRMWARE_PACKAGES: ${{ matrix.firmware_packages }}
        run: |
          sudo bash scripts/ensure-ubuntu-apt-sources.sh
          sudo timeout --foreground --signal=TERM --kill-after=30s 1800s apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o Acquire::ftp::Timeout=30 \
            -o Acquire::Queue-Mode=access \
            install -y \
            build-essential bc bison flex libelf-dev libssl-dev libncurses-dev \
            git gnupg curl perl cpio gzip binutils file mtools xorriso openssl apt-utils \
            mmdebstrap qemu-user-static binfmt-support e2fsprogs kmod util-linux \
            dosfstools python3-pexpect \
            ${CROSS_PACKAGES} ${QEMU_PACKAGE} ${FIRMWARE_PACKAGES}
          sudo systemctl restart systemd-binfmt.service
          for target in aarch64 riscv64; do
            handler="/proc/sys/fs/binfmt_misc/qemu-$target"
            if [[ ! -r "$handler" ]] || ! grep -Eq '^flags:.*F' "$handler"; then
              echo "error: chroot-safe QEMU binfmt handler is missing or lacks the F flag: $handler" >&2
              [[ -r "$handler" ]] && cat "$handler" >&2
              exit 1
            fi
          done

      - name: Validate signed APT repository generation and verification
        run: python3 -m unittest discover -s tests -p 'test_kernel_apt_repository.py' -v

      - name: Prepare runner-owned build workspace
        run: mkdir -p "$GITHUB_WORKSPACE/build/base-userspace"

      - name: Prepare signed-media test or release key
        env:
          AURA_RELEASE_PRIVATE_KEY_PEM: ${{ secrets.AURA_RELEASE_PRIVATE_KEY_PEM }}
          AURA_RELEASE_PUBLIC_KEY_PEM: ${{ vars.AURA_RELEASE_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/aura-release-signing"
          mkdir -p "$key_dir"
          private_key="$key_dir/private.pem"
          public_key="$key_dir/public.pem"
          public_key_input="$key_dir/public-input.pem"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ -n "$AURA_RELEASE_PRIVATE_KEY_PEM" && -n "$AURA_RELEASE_PUBLIC_KEY_PEM" ]] || {
              echo "error: tagged release builds require AURA_RELEASE_PRIVATE_KEY_PEM (Secret) and AURA_RELEASE_PUBLIC_KEY_PEM (Variable)." >&2
              exit 1
            }
            printf '%s\n' "$AURA_RELEASE_PRIVATE_KEY_PEM" > "$private_key"
            printf '%s\n' "$AURA_RELEASE_PUBLIC_KEY_PEM" > "$public_key_input"
            openssl pkey -pubin -in "$public_key_input" -pubout -out "$public_key"
            mode="release-key"
          else
            # PR and branch CI uses an ephemeral key to exercise verification.
            # Such artifacts are test outputs, not trusted release media.
            openssl genpkey -algorithm ED25519 -out "$private_key"
            openssl pkey -in "$private_key" -pubout -out "$public_key"
            mode="ci-ephemeral"
          fi
          chmod 0600 "$private_key"
          derived="$key_dir/derived-public.pem"
          openssl pkey -in "$private_key" -pubout -out "$derived"
          cmp -s "$derived" "$public_key" || {
            echo "error: configured release private/public keys do not match." >&2
            exit 1
          }
          fingerprint="$(openssl pkey -pubin -in "$public_key" -outform DER | sha256sum | awk '{print $1}')"
          {
            echo "AURA_RELEASE_PRIVATE_KEY_FILE=$private_key"
            echo "AURA_RELEASE_PUBLIC_KEY_FILE=$public_key"
            echo "AURA_RELEASE_PUBLIC_KEY_FINGERPRINT=$fingerprint"
            echo "AURA_RELEASE_SIGNING_MODE=$mode"
          } >> "$GITHUB_ENV"

      - name: Prepare pinned APT repository trust key
        env:
          AURA_APT_REPOSITORY_PUBLIC_KEY_ASC: ${{ vars.AURA_APT_REPOSITORY_PUBLIC_KEY_ASC }}
          AURA_APT_REPOSITORY_FINGERPRINT: ${{ vars.AURA_APT_REPOSITORY_FINGERPRINT }}
        run: bash scripts/prepare-apt-repository-key.sh

      - name: Prepare verified Debian Trixie signing keyring
        run: |
          sudo bash scripts/prepare-debian-trixie-keyring.sh \
            "$GITHUB_WORKSPACE/build/base-userspace/debian-trixie-keyring.gpg"

      - name: Build the upstream Aura kernel baseline
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
          JOBS: "2"
        run: bash scripts/build-kernel.sh

      - name: Build the installed system initramfs
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: bash scripts/build-initramfs-target.sh

      - name: Build the target-native Debian 13 root filesystem
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
          OUTPUT_DIR: ${{ github.workspace }}/build/base-userspace/${{ matrix.target_arch }}
          DEBIAN_KEYRING: ${{ github.workspace }}/build/base-userspace/debian-trixie-keyring.gpg
        run: sudo --preserve-env=TARGET_ARCH,OUTPUT_DIR,DEBIAN_KEYRING,AURA_APT_REPOSITORY_PUBLIC_KEY_FILE,AURA_APT_REPOSITORY_URL bash scripts/build-base-rootfs.sh

      - name: Build the Debian installer initramfs
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: sudo --preserve-env=TARGET_ARCH,AURA_RELEASE_PUBLIC_KEY_FILE bash scripts/build-installer-initramfs.sh

      - name: Build the EFI-stub kernel with installer userspace
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
          INITRAMFS_ROOTFS: ${{ github.workspace }}/build/installer-initramfs/${{ matrix.target_arch }}/rootfs
          JOBS: "2"
        run: sudo --preserve-env=TARGET_ARCH,INITRAMFS_ROOTFS,JOBS bash scripts/build-kernel-efi-iso.sh

      - name: Build the GRUB-loaded kernel for the installed system
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
          JOBS: "2"
        run: bash scripts/build-installed-kernel.sh

      - name: Build versioned Debian kernel packages
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
          JOBS: "2"
        run: bash scripts/build-kernel-package.sh

      - name: Assemble the installable UEFI ISO
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
          AURA_INSTALLER_MODE: "1"
        run: bash scripts/build-uefi-iso.sh

      - name: Verify detached ISO signature and release-key fingerprint
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: |
          set -euo pipefail
          iso="$GITHUB_WORKSPACE/build/iso/aura-os-${TARGET_ARCH}-uefi.iso"
          openssl pkeyutl -verify -pubin -inkey "$AURA_RELEASE_PUBLIC_KEY_FILE" \
            -rawin -in "$iso.sha256" -sigfile "$iso.sha256.sig"
          (cd "$(dirname "$iso")" && sha256sum --check "$(basename "$iso").sha256")
          expected_fingerprint="$(openssl pkey -pubin -in "$AURA_RELEASE_PUBLIC_KEY_FILE" -outform DER | sha256sum | awk '{print $1}')"
          actual_fingerprint="$(awk '{print $1}' "$iso.pub.fingerprint")"
          [[ "$actual_fingerprint" == "$expected_fingerprint" ]]

      - name: Install to a second QEMU disk and boot without the ISO
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: |
          python3 scripts/test-installer-qemu.py \
            --arch "${{ matrix.target_arch }}" \
            --iso "$GITHUB_WORKSPACE/build/iso/aura-os-${{ matrix.target_arch }}-uefi.iso" \
            --disk "$GITHUB_WORKSPACE/build/qemu-installer/aura-${{ matrix.target_arch }}-target.raw"

      - name: Upload ISO, disk metadata, logs, and build provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-os-installer-${{ matrix.target_arch }}
          path: |
            build/iso/aura-os-${{ matrix.target_arch }}-uefi.iso
            build/iso/aura-os-${{ matrix.target_arch }}-uefi.iso.sha256
            build/iso/aura-os-${{ matrix.target_arch }}-uefi.iso.sha256.sig
            build/iso/aura-os-${{ matrix.target_arch }}-uefi.iso.pub
            build/iso/aura-os-${{ matrix.target_arch }}-uefi.iso.pub.fingerprint
            build/iso/aura-os-${{ matrix.target_arch }}-uefi.iso.provenance.json
            build/iso/aura-os-${{ matrix.target_arch }}-uefi.iso.eltorito.txt
            build/base-userspace/${{ matrix.target_arch }}/aura-base-${{ matrix.target_arch }}.tar.gz
            build/base-userspace/${{ matrix.target_arch }}/aura-base-${{ matrix.target_arch }}.tar.gz.sha256
            build/base-userspace/${{ matrix.target_arch }}/packages.tsv
            build/base-userspace/${{ matrix.target_arch }}/build-provenance.txt
            build/installer-initramfs/${{ matrix.target_arch }}/aura-installer-initramfs-${{ matrix.target_arch }}.cpio.gz*
            build/installer-initramfs/${{ matrix.target_arch }}/build-provenance.txt
            build/kernel-efi-iso/${{ matrix.target_arch }}/efi-kernel-provenance.txt
            build/kernel/source-verification.txt
            build/kernel-installed/${{ matrix.target_arch }}/*
            build/kernel-packages/${{ matrix.target_arch }}/*.deb
            build/qemu-installer/*.log
            build/qemu-installer/*.sfdisk
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  publish-kernel-apt-repository:
    name: Publish signed Aura kernel APT repository
    if: startsWith(github.ref, 'refs/tags/v')
    needs: install-and-boot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out Aura OS
        uses: actions/checkout@v4

      - name: Download architecture kernel packages
        uses: actions/download-artifact@v4
        with:
          pattern: aura-os-installer-*
          path: ${{ runner.temp }}/aura-installer-artifacts
          merge-multiple: true

      - name: Restore the existing Pages repository
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: existing-pages
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare and verify the dedicated APT signing key
        env:
          AURA_APT_REPOSITORY_SIGNING_KEY_ASC: ${{ secrets.AURA_APT_REPOSITORY_SIGNING_KEY_ASC }}
          AURA_APT_REPOSITORY_PUBLIC_KEY_ASC: ${{ vars.AURA_APT_REPOSITORY_PUBLIC_KEY_ASC }}
          AURA_APT_REPOSITORY_FINGERPRINT: ${{ vars.AURA_APT_REPOSITORY_FINGERPRINT }}
        run: |
          set -euo pipefail
          : "${AURA_APT_REPOSITORY_SIGNING_KEY_ASC:?missing AURA_APT_REPOSITORY_SIGNING_KEY_ASC secret}"
          : "${AURA_APT_REPOSITORY_PUBLIC_KEY_ASC:?missing AURA_APT_REPOSITORY_PUBLIC_KEY_ASC variable}"
          : "${AURA_APT_REPOSITORY_FINGERPRINT:?missing AURA_APT_REPOSITORY_FINGERPRINT variable}"
          key_dir="$RUNNER_TEMP/aura-apt-publish-key"
          export GNUPGHOME="$key_dir/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 0700 "$key_dir" "$GNUPGHOME"
          printf '%s\n' "$AURA_APT_REPOSITORY_SIGNING_KEY_ASC" > "$key_dir/private.asc"
          printf '%s\n' "$AURA_APT_REPOSITORY_PUBLIC_KEY_ASC" > "$key_dir/public.asc"
          public_fingerprint="$(gpg --batch --show-keys --with-colons "$key_dir/public.asc" | awk -F: '$1 == "fpr" { print toupper($10); exit }')"
          [[ "$public_fingerprint" == "${AURA_APT_REPOSITORY_FINGERPRINT^^}" ]]
          gpg --batch --import "$key_dir/private.asc" "$key_dir/public.asc"
          secret_fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print toupper($10); exit }')"
          [[ "$secret_fingerprint" == "$public_fingerprint" ]]
          {
            echo "AURA_APT_REPOSITORY_PRIVATE_KEY_FILE=$key_dir/private.asc"
            echo "AURA_APT_REPOSITORY_PUBLIC_KEY_FILE=$key_dir/public.asc"
            echo "AURA_APT_REPOSITORY_FINGERPRINT=$public_fingerprint"
            echo "AURA_APT_GNUPGHOME=$GNUPGHOME"
          } >> "$GITHUB_ENV"

      - name: Build and sign the cumulative APT repository
        env:
          AURA_APT_REPOSITORY_URL: https://nebula-INE.github.io/aura_os/apt
          AURA_APT_REPOSITORY_SIGNING_KEY_PASSPHRASE: ${{ secrets.AURA_APT_REPOSITORY_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aura-kernel-site/apt"
          if [[ -d existing-pages/apt ]]; then
            cp -a existing-pages/apt/. "$RUNNER_TEMP/aura-kernel-site/apt/"
          fi
          bash scripts/build-kernel-apt-repository.sh \
            "$RUNNER_TEMP/aura-installer-artifacts" \
            "$RUNNER_TEMP/aura-kernel-site/apt"

      - name: Publish APT repository to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ${{ runner.temp }}/aura-kernel-site/apt
          destination_dir: apt
          keep_files: true
          commit_message: "publish: Aura kernel APT repository ${{ github.ref_name }}"
